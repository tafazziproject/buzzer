<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1767ff">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
  <title>Tafazzi Project</title>
</head>

<body class="m-0 min-h-[100dvh] overflow-hidden bg-[#06133f] text-white antialiased">
  <main id="app-shell"
    class="relative mx-auto h-[100dvh] w-full max-w-[430px] overflow-hidden bg-gradient-to-b from-[#44a8f7] via-[#2268ee] to-[#073ee7] md:my-4 md:h-[calc(100dvh-2rem)] md:rounded-[2.5rem] md:shadow-2xl">

    <!-- HOME -->
    <section id="home-screen" class="screen absolute inset-0 flex flex-col px-5 pb-[calc(7.5rem+env(safe-area-inset-bottom))] pt-[calc(1.25rem+env(safe-area-inset-top))]">
      <header class="flex items-center justify-between">
        <div class="text-[13px] font-black tracking-tight text-white/90">TAFAZZI</div>

        <button id="settings-button" type="button" aria-label="Impostazioni"
          class="grid h-10 w-10 place-items-center rounded-full bg-white/55 text-[#083378] shadow-lg backdrop-blur-xl transition hover:scale-105 active:scale-95">
          <svg viewBox="0 0 24 24" class="h-5 w-5 fill-current" aria-hidden="true">
            <path d="M19.14 12.94a7.43 7.43 0 0 0 .05-.94 7.43 7.43 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.5 7.5 0 0 0-1.63-.94L14.38 2.8A.5.5 0 0 0 13.89 2h-3.78a.5.5 0 0 0-.49.4l-.36 2.52c-.58.24-1.12.56-1.63.94L5.24 4.9a.5.5 0 0 0-.61.22L2.71 8.44a.5.5 0 0 0 .12.64l2.03 1.58c-.03.31-.05.63-.05.94s.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.39 1.05.7 1.63.94l.36 2.52a.5.5 0 0 0 .49.4h3.78a.5.5 0 0 0 .49-.4l.36-2.52c.58-.24 1.12-.55 1.63-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z" />
          </svg>
        </button>
      </header>

      <div class="flex flex-1 flex-col items-center justify-center -translate-y-5">
        <p id="play-label" class="mb-5 text-[17px] font-black tracking-tight text-white">Tap to Tafazzi</p>

        <button id="playButton" type="button" aria-label="Riproduci un audio casuale"
          class="group relative grid h-[154px] w-[154px] place-items-center rounded-full border border-white/55 bg-white/10 shadow-[0_16px_50px_rgba(0,44,198,.35)] backdrop-blur-md transition active:scale-95 disabled:cursor-wait disabled:opacity-70">
          <span class="absolute inset-[1px] rounded-full bg-gradient-to-br from-white/15 to-transparent"></span>
          <span class="relative grid h-[92px] w-[92px] place-items-center rounded-full bg-white text-[#2b63ec] shadow-xl transition-transform duration-200 group-hover:scale-105">
            <svg viewBox="0 0 96 96" class="h-[58px] w-[58px]" aria-hidden="true">
              <path fill="currentColor" d="M63.8 19.4a10 10 0 0 1 0 14.1L44.6 52.7a8 8 0 0 0 11.3 11.3l8.6-8.6a10 10 0 1 1 14.1 14.1L70 78.1a28 28 0 0 1-39.6-39.6l19.2-19.1a10 10 0 0 1 14.2 0Z"/>
              <path fill="currentColor" d="M32.2 76.6a10 10 0 0 1 0-14.1l19.2-19.2A8 8 0 1 0 40.1 32l-8.6 8.6a10 10 0 1 1-14.1-14.1l8.6-8.6a28 28 0 1 1 39.6 39.6L46.4 76.6a10 10 0 0 1-14.2 0Z"/>
            </svg>
          </span>
        </button>

        <div class="mt-6 flex items-center gap-2 rounded-full bg-[#0c3cb6]/28 px-3 py-1.5 backdrop-blur-md">
          <span id="mode-dot" class="h-2 w-2 rounded-full bg-emerald-300"></span>
          <span id="home-mode-label" class="text-[11px] font-black tracking-[.16em] text-white/85">SAFE MODE</span>
        </div>
      </div>

      <section class="mb-1">
        <div class="mb-2 px-3 text-[11px] font-bold text-white/65">Recently played</div>
        <button id="recent-card" type="button"
          class="flex w-full items-center gap-3 rounded-[18px] bg-white/14 p-2.5 text-left shadow-[0_10px_30px_rgba(0,35,150,.18)] backdrop-blur-xl transition hover:bg-white/20 active:scale-[.99]">
          <div class="grid h-12 w-12 shrink-0 place-items-center rounded-[11px] bg-white/85 text-[#2461ee] shadow-md">
            <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current" aria-hidden="true"><path d="M9 18V5l11-2v13a3.5 3.5 0 1 1-2-3.16V7.2l-7 1.27V18a3.5 3.5 0 1 1-2-3.16Z"/></svg>
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-[10px] font-semibold text-white/55">Ultimo audio</div>
            <div id="recent-name" class="truncate text-[13px] font-black text-white">Nessuna riproduzione</div>
            <div id="recent-state" class="text-[10px] font-medium text-white/60">Tocca il pulsante centrale</div>
          </div>
          <svg viewBox="0 0 24 24" class="h-5 w-5 shrink-0 fill-none stroke-white/65 stroke-2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </section>
    </section>

    <!-- LIBRARY -->
    <section id="library-screen" class="screen absolute inset-0 hidden flex-col px-5 pb-[calc(7.5rem+env(safe-area-inset-bottom))] pt-[calc(1.25rem+env(safe-area-inset-top))]">
      <header class="mb-5 flex items-center justify-between">
        <div>
          <p class="text-[11px] font-bold uppercase tracking-[.18em] text-white/55">Tafazzi Project</p>
          <h1 class="text-[30px] font-black tracking-[-.04em]">Library</h1>
        </div>
        <div id="library-count" class="rounded-full bg-white/15 px-3 py-1.5 text-[11px] font-black text-white/80 backdrop-blur-xl">0 audio</div>
      </header>

      <div class="mb-4 grid grid-cols-2 rounded-[18px] bg-[#07379d]/35 p-1 backdrop-blur-xl">
        <button id="safe-tab" type="button" class="mode-tab active rounded-[14px] px-3 py-2.5 text-[12px] font-black transition">SAFE</button>
        <button id="nsfw-tab" type="button" class="mode-tab rounded-[14px] px-3 py-2.5 text-[12px] font-black transition">NOT SAFE</button>
      </div>

      <div class="relative mb-4">
        <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 fill-none stroke-white/55 stroke-2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="library-search" type="search" placeholder="Cerca audio"
          class="w-full rounded-[16px] border-0 bg-white/12 py-3 pl-10 pr-4 text-[13px] font-semibold text-white outline-none placeholder:text-white/45 focus:bg-white/18">
      </div>

      <div id="audio-list" class="scrollbar-none flex-1 space-y-2 overflow-y-auto pr-0.5"></div>
    </section>

    <!-- Bottom navigation -->
    <nav id="bottom-nav"
      class="absolute bottom-[calc(.75rem+env(safe-area-inset-bottom))] left-1/2 z-30 flex w-[calc(100%-2rem)] -translate-x-1/2 items-center gap-1 rounded-[24px] bg-white/75 p-1.5 text-[#173a8c] shadow-[0_14px_40px_rgba(0,29,126,.28)] backdrop-blur-2xl">
      <button id="home-tab" type="button" class="nav-item active flex flex-1 flex-col items-center justify-center rounded-[19px] py-2 text-[10px] font-black transition">
        <svg viewBox="0 0 24 24" class="mb-0.5 h-5 w-5 fill-current" aria-hidden="true"><path d="M3 10.6 12 3l9 7.6V21h-6v-6H9v6H3Z"/></svg>
        Home
      </button>
      <button id="library-tab" type="button" class="nav-item flex flex-1 flex-col items-center justify-center rounded-[19px] py-2 text-[10px] font-black transition">
        <svg viewBox="0 0 24 24" class="mb-0.5 h-5 w-5 fill-current" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm2 3v11h2V7H7Zm4 0v11h2V7h-2Zm4 0v11h2V7h-2Z"/></svg>
        Library
      </button>
    </nav>

    <!-- Settings modal / SAFE switch -->
    <div id="settings-panel" class="pointer-events-none absolute inset-0 z-50 flex items-end bg-[#001b66]/0 opacity-0 transition duration-300">
      <button id="settings-backdrop" class="absolute inset-0 cursor-default" aria-label="Chiudi impostazioni"></button>
      <div id="settings-sheet" class="relative z-10 w-full translate-y-full rounded-t-[30px] bg-white/92 px-5 pb-[calc(1.5rem+env(safe-area-inset-bottom))] pt-3 text-[#153376] shadow-2xl backdrop-blur-2xl transition duration-300">
        <div class="mx-auto mb-4 h-1.5 w-12 rounded-full bg-[#153376]/15"></div>
        <div class="mb-5 flex items-center justify-between">
          <div>
            <div class="text-[11px] font-black uppercase tracking-[.14em] text-[#153376]/45">Riproduzione</div>
            <div class="text-xl font-black">Modalità contenuti</div>
          </div>
          <span id="switch-label" class="rounded-full bg-emerald-100 px-3 py-1.5 text-[11px] font-black text-emerald-700">SAFE</span>
        </div>

        <label class="flex cursor-pointer items-center justify-between rounded-[20px] bg-[#ebf1ff] p-4">
          <div class="pr-4">
            <div class="text-[14px] font-black">NOT SAFE</div>
            <div class="mt-0.5 text-[11px] font-semibold text-[#153376]/55">Attiva gli audio contrassegnati come non safe.</div>
          </div>
          <input id="nsfw-switch" type="checkbox" class="peer sr-only">
          <span class="relative h-8 w-14 shrink-0 rounded-full bg-emerald-500 transition peer-checked:bg-rose-500 after:absolute after:left-1 after:top-1 after:h-6 after:w-6 after:rounded-full after:bg-white after:shadow after:transition peer-checked:after:translate-x-6"></span>
        </label>
      </div>
    </div>
  </main>
</body>

</html>
